<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<div class="Caixa">
    <h1>Login</h1>
    <form action="#">
        <div class="user">
            <input class= "email" type="text" placeholder="Email/Usuário" ><br>
        </div>
        <input class= "senha" type="password" placeholder="Senha">
        <label>
            <input class="check" type="checkbox">
            Lembrar minha senha
            <a class="esqueci"href="#">Esqueci minha senha</a>
        </label>
        <button type="submit">Entrar</button>
        <div class="conta">
            Não possui uma conta?<a class="criar"href="#">Clique aqui</a>
        </div>
    </form>
</div>
</body>
</html>
